apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw9-service1
  namespace: default
  labels:
    app: hw9-service1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hw9-service1
  template:
    metadata:
      labels:
        app: hw9-service1
    spec:
      containers:
      - name: service1
        image: gcr.io/PROJECT_ID/hw9-service1:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: hw9-config
              key: project-id
        - name: BUCKET
          valueFrom:
            configMapKeyRef:
              name: hw9-config
              key: bucket-name
        - name: PAGES_PREFIX
          valueFrom:
            configMapKeyRef:
              name: hw9-config
              key: pages-prefix
        - name: PORT
          value: "8080"
        - name: TOPIC
          valueFrom:
            configMapKeyRef:
              name: hw9-config
              key: topic-name
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: hw9-service1
  namespace: default
  labels:
    app: hw9-service1
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: hw9-service1